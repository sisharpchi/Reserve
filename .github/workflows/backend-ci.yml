name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Restore, build, and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ReserveFlow.sln

      - name: Build
        run: dotnet build ReserveFlow.sln --no-restore -v minimal -maxcpucount:1 /nr:false

      - name: Smoke tests
        run: dotnet run --project test/ReserveFlow.Backend.SmokeTests/ReserveFlow.Backend.SmokeTests.csproj --no-build

      - name: Validate Docker Compose
        run: docker compose config --quiet
